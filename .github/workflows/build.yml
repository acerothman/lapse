name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: ./build.sh --no-open

      - name: Zip app
        run: ditto -c -k --keepParent build/Lapse.app Lapse-1.0.0.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lapse-1.0.0
          path: Lapse-1.0.0.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Lapse-1.0.0.zip
