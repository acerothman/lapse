name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: scripts/test.sh

      - name: Build
        run: ./build.sh --no-open

      - name: Check the bundle
        run: |
          test -d build/Lapse.app/Contents/Resources/Metadata.appintents
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Lapse.app/Contents/Info.plist
          codesign --verify --verbose=1 build/Lapse.app

      - name: Zip app
        id: zip
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          NAME="Lapse-${VERSION}.zip"
          ditto -c -k --keepParent build/Lapse.app "$NAME"
          echo "file=$NAME" >> "$GITHUB_OUTPUT"
          echo "artifact=Lapse-${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.artifact }}
          path: ${{ steps.zip.outputs.file }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zip.outputs.file }}
