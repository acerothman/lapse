name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: ./build.sh --no-open

      - name: Zip app
        id: zip
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          NAME="Lapse-${VERSION}.zip"
          ditto -c -k --keepParent build/Lapse.app "$NAME"
          echo "file=$NAME" >> "$GITHUB_OUTPUT"
          echo "artifact=Lapse-${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.artifact }}
          path: ${{ steps.zip.outputs.file }}

      - name: Sign update and write appcast
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_EDDSA_PRIVATE_KEY" ]; then
            echo "SPARKLE_EDDSA_PRIVATE_KEY is not set. Skipping the signed appcast."
            exit 0
          fi
          ./scripts/make_appcast.sh "${{ steps.zip.outputs.file }}"

      - name: Upload appcast
        if: hashFiles('appcast.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: appcast.xml
          path: appcast.xml

      - name: Collect release files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release-files
          cp Lapse-*.zip release-files/
          if [ -f appcast.xml ]; then cp appcast.xml release-files/; fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
